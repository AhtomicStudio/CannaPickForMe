<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Lore — CannaPickForMe</title>
  <meta name="description" content="Decode the ancient strain secrets. Learn about terpenes, cannabinoids, strain types, and more." />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --purple:      #a855f7;
      --purple-glow: #c084fc;
      --purple-dim:  #7c3aed;
      --green:       #22c55e;
      --green-glow:  #4ade80;
      --bg:          #0a0e17;
      --card:        #141b2d;
      --card-hover:  #1a2440;
      --border:      rgba(168,85,247,0.18);
      --text:        #f1f5f9;
      --muted:       #94a3b8;
      --dim:         #64748b;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── HAZE ── */
    .haze-blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      pointer-events: none;
      z-index: 0;
    }
    .haze-blob--1 {
      width: 640px; height: 640px;
      background: radial-gradient(circle, rgba(168,85,247,0.13) 0%, transparent 70%);
      top: -230px; left: -170px;
      animation: haze-breathe 8s ease-in-out infinite alternate;
    }
    .haze-blob--2 {
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(34,197,94,0.09) 0%, transparent 70%);
      bottom: -160px; right: -130px;
      animation: haze-breathe 10s ease-in-out infinite alternate;
      animation-delay: -4s;
    }
    .haze-blob--3 {
      width: 380px; height: 380px;
      background: radial-gradient(circle, rgba(192,132,252,0.08) 0%, transparent 70%);
      top: 40%; right: 5%;
      animation: haze-breathe 13s ease-in-out infinite alternate;
      animation-delay: -7s;
    }

    @keyframes haze-breathe {
      from { opacity: 0.5; transform: scale(1); }
      to   { opacity: 1;   transform: scale(1.2); }
    }

    /* ── FLOATING LEAVES ── */
    .leaf {
      position: fixed;
      font-size: var(--size, 1.5rem);
      animation: float-leaf var(--dur, 14s) linear infinite;
      animation-delay: var(--delay, 0s);
      opacity: 0;
      z-index: 1;
      pointer-events: none;
      left: var(--x, 50%);
      bottom: -5vh;
      user-select: none;
    }

    @keyframes float-leaf {
      0%   { transform: translateY(0)      translateX(0)                              rotate(var(--r0, 0deg));    opacity: 0; }
      5%   { opacity: var(--op, 0.35); }
      50%  { transform: translateY(-55vh)  translateX(var(--dx, 12px))                rotate(calc(var(--r0, 0deg) + 90deg)); }
      95%  { opacity: var(--op, 0.35); }
      100% { transform: translateY(-112vh) translateX(calc(var(--dx, 12px) * 2))      rotate(var(--r1, 180deg));  opacity: 0; }
    }

    /* ── PAGE ── */
    .page {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1.25rem 4rem;
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
    }

    .back-btn {
      align-self: flex-start;
      color: var(--dim);
      text-decoration: none;
      font-size: 0.85rem;
      margin-bottom: 2rem;
      transition: color 0.2s;
      font-family: 'Space Grotesk', sans-serif;
      letter-spacing: 0.02em;
    }
    .back-btn:hover { color: var(--purple); }

    /* ── HEADER ── */
    .lore-header {
      width: 100%;
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .lore-header__leaf-row {
      font-size: 1.4rem;
      letter-spacing: 0.5rem;
      margin-bottom: 1.25rem;
      opacity: 0.5;
    }

    .lore-header__overline {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.6rem;
      color: var(--purple-glow);
      text-transform: uppercase;
      letter-spacing: 0.25em;
      font-weight: 600;
      margin-bottom: 0.5rem;
      opacity: 0.75;
    }

    .lore-header__title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2.6rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 0.5rem;
      line-height: 1.1;
      background: linear-gradient(135deg, #f1f5f9 0%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .lore-header__divider {
      width: 40px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--purple), transparent);
      margin: 0.85rem auto;
      border-radius: 99px;
    }

    .lore-header__intro {
      font-size: 0.92rem;
      color: var(--muted);
      line-height: 1.65;
      white-space: pre-wrap;
      text-align: center;
    }

    /* ── TOPIC CARDS ── */
    .topics-grid {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .topic-card {
      width: 100%;
      border-radius: 14px;
      border: 1.5px solid var(--border);
      background: var(--card);
      overflow: hidden;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .topic-card:hover {
      border-color: rgba(168,85,247,0.35);
    }

    .topic-card--open {
      border-color: rgba(168,85,247,0.45);
      box-shadow: 0 0 0 1px rgba(168,85,247,0.12), 0 8px 32px rgba(168,85,247,0.10);
    }

    .topic-card__trigger {
      width: 100%;
      background: none;
      border: none;
      cursor: pointer;
      padding: 1.1rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      text-align: left;
      transition: background 0.18s;
    }

    .topic-card__trigger:hover {
      background: rgba(168,85,247,0.05);
    }

    .topic-card__icon {
      font-size: 1.8rem;
      flex-shrink: 0;
      width: 2.5rem;
      text-align: center;
      line-height: 1;
    }

    .topic-card__text {
      flex: 1;
      min-width: 0;
    }

    .topic-card__title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 0.2rem;
    }

    .topic-card__teaser {
      font-size: 0.82rem;
      color: var(--muted);
      line-height: 1.4;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .topic-card__chevron {
      font-size: 0.85rem;
      color: var(--purple-glow);
      flex-shrink: 0;
      transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
      opacity: 0.7;
    }

    .topic-card--open .topic-card__chevron {
      transform: rotate(180deg);
    }

    /* Accordion body */
    .topic-card__body {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.32s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .topic-card--open .topic-card__body {
      grid-template-rows: 1fr;
    }

    .topic-card__body-inner {
      overflow: hidden;
    }

    .topic-card__content {
      padding: 0 1.25rem 1.4rem 1.25rem;
      border-top: 1px solid rgba(168,85,247,0.12);
      margin-top: 0;
      padding-top: 1.1rem;
    }

    .topic-card__content p {
      font-size: 0.93rem;
      color: var(--muted);
      line-height: 1.75;
      white-space: pre-wrap;
    }

    .topic-card__content p em {
      color: var(--purple-glow);
      font-style: normal;
    }

    /* ── LOADING / EMPTY STATES ── */
    .topics-loading {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--dim);
      font-size: 0.9rem;
    }

    .topics-loading__spinner {
      display: inline-block;
      width: 28px;
      height: 28px;
      border: 2px solid rgba(168,85,247,0.2);
      border-top-color: var(--purple);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 0.75rem;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .topic-coming-soon {
      font-size: 0.82rem;
      color: var(--dim);
      font-style: italic;
      margin-top: 0.25rem;
    }

    /* ── SKELETON CARDS ── */
    .topic-skeleton {
      width: 100%;
      border-radius: 14px;
      border: 1.5px solid rgba(168,85,247,0.08);
      background: var(--card);
      padding: 1.1rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .skeleton-icon {
      width: 2.5rem;
      height: 2.5rem;
      border-radius: 50%;
      background: rgba(168,85,247,0.08);
      animation: skeleton-pulse 1.5s ease-in-out infinite;
      flex-shrink: 0;
    }

    .skeleton-text {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .skeleton-line {
      height: 0.8rem;
      border-radius: 6px;
      background: rgba(168,85,247,0.08);
      animation: skeleton-pulse 1.5s ease-in-out infinite;
    }

    .skeleton-line--short { width: 55%; animation-delay: 0.15s; }
    .skeleton-line--full  { width: 85%; }

    @keyframes skeleton-pulse {
      0%, 100% { opacity: 0.5; }
      50%       { opacity: 1; }
    }

    /* ── FOOTER TAPE ── */
    .lore-tape {
      width: 100%;
      margin-top: 3rem;
      padding: 0.5rem 1rem;
      background: repeating-linear-gradient(
        -45deg,
        rgba(168,85,247,0.10),
        rgba(168,85,247,0.10) 10px,
        rgba(168,85,247,0.03) 10px,
        rgba(168,85,247,0.03) 20px
      );
      border-radius: 8px;
      border: 1px solid rgba(168,85,247,0.14);
      font-size: 0.58rem;
      font-family: 'Space Grotesk', sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.28em;
      color: rgba(192,132,252,0.5);
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="haze-blob haze-blob--1"></div>
  <div class="haze-blob haze-blob--2"></div>
  <div class="haze-blob haze-blob--3"></div>

  <span class="leaf" style="--x:3%;  --size:1.8rem;--dur:13s;--delay:-2s; --dx:18px; --r0:-15deg;--r1:200deg;--op:0.28">🍃</span>
  <span class="leaf" style="--x:10%; --size:1.2rem;--dur:16s;--delay:-8s; --dx:-12px;--r0:30deg; --r1:-150deg;--op:0.23">🌿</span>
  <span class="leaf" style="--x:18%; --size:2.1rem;--dur:11s;--delay:-4s; --dx:22px; --r0:-40deg;--r1:180deg;--op:0.30">🍃</span>
  <span class="leaf" style="--x:27%; --size:1.5rem;--dur:15s;--delay:0s;  --dx:-8px; --r0:10deg; --r1:-200deg;--op:0.20">🌿</span>
  <span class="leaf" style="--x:37%; --size:1.0rem;--dur:18s;--delay:-11s;--dx:15px; --r0:-25deg;--r1:160deg;--op:0.26">🍃</span>
  <span class="leaf" style="--x:48%; --size:1.6rem;--dur:14s;--delay:-5s; --dx:10px; --r0:5deg;  --r1:-180deg;--op:0.20">🌿</span>
  <span class="leaf" style="--x:57%; --size:1.7rem;--dur:12s;--delay:-6s; --dx:-20px;--r0:45deg; --r1:-180deg;--op:0.26">🌿</span>
  <span class="leaf" style="--x:66%; --size:1.3rem;--dur:14s;--delay:-3s; --dx:10px; --r0:-30deg;--r1:220deg;--op:0.30">🍃</span>
  <span class="leaf" style="--x:74%; --size:2.3rem;--dur:10s;--delay:-9s; --dx:-18px;--r0:20deg; --r1:-170deg;--op:0.20">🌿</span>
  <span class="leaf" style="--x:82%; --size:1.4rem;--dur:17s;--delay:-1s; --dx:25px; --r0:-50deg;--r1:190deg;--op:0.28">🍃</span>
  <span class="leaf" style="--x:89%; --size:1.0rem;--dur:13s;--delay:-14s;--dx:-14px;--r0:15deg; --r1:-160deg;--op:0.23">🌿</span>
  <span class="leaf" style="--x:95%; --size:1.9rem;--dur:15s;--delay:-7s; --dx:-22px;--r0:-10deg;--r1:200deg;--op:0.28">🍃</span>

  <div class="page">
    <a href="/" class="back-btn">← Back to App</a>

    <div class="lore-header">
      <div class="lore-header__leaf-row">🍃 🌿 🍃</div>
      <p class="lore-header__overline">Ancient Knowledge</p>
      <h1 class="lore-header__title">The Lore</h1>
      <div class="lore-header__divider"></div>
      <p class="lore-header__intro" id="lore-intro">Decoding the cosmos, one strain at a time. 🔮</p>
    </div>

    <!-- Topic cards / under-construction sign injected here -->
    <div id="lore-body" style="width:100%;"></div>

    <div class="lore-tape" id="lore-tape" style="display:none;">🌿 &nbsp; the lore goes deep &nbsp; 🌿</div>
  </div>

  <!-- Under-construction styles (only used when no topics yet) -->
  <style>
    .sign {
      width: 100%;
      border-radius: 20px;
      padding: 2.5rem 2rem 0;
      text-align: center;
      background:
        linear-gradient(var(--card), var(--card)) padding-box,
        linear-gradient(135deg, rgba(168,85,247,0.55) 0%, rgba(34,197,94,0.12) 50%, rgba(168,85,247,0.45) 100%) border-box;
      border: 1.5px solid transparent;
      animation: sign-glow 4s ease-in-out infinite alternate;
      overflow: hidden;
    }
    @keyframes sign-glow {
      from { box-shadow: 0 0 40px rgba(168,85,247,0.07), 0 8px 40px rgba(0,0,0,0.5); }
      to   { box-shadow: 0 0 80px rgba(168,85,247,0.18), 0 8px 40px rgba(0,0,0,0.5); }
    }
    .sign__leaf-row  { font-size:1.5rem; letter-spacing:0.6rem; margin-bottom:1.75rem; opacity:0.55; }
    .sign__cone      { font-size:3.2rem; display:block; margin-bottom:0.6rem; animation: wobble 2.8s ease-in-out infinite; }
    @keyframes wobble { 0%,100%{transform:rotate(-9deg)} 50%{transform:rotate(9deg)} }
    .sign__overline  { font-family:'Space Grotesk',sans-serif; font-size:0.62rem; color:var(--purple-glow); text-transform:uppercase; letter-spacing:0.22em; font-weight:600; margin-bottom:0.7rem; opacity:0.8; }
    .sign__title     { font-family:'Space Grotesk',sans-serif; font-size:2.4rem; font-weight:700; color:var(--text); margin-bottom:1rem; line-height:1.1; }
    .sign__divider   { width:40px; height:2px; background:linear-gradient(90deg,transparent,var(--purple),transparent); margin:0 auto 1.25rem; border-radius:99px; }
    .sign__body      { font-size:0.95rem; color:var(--dim); line-height:1.65; }
    .sign__tagline   { font-size:0.82rem; color:var(--purple-glow); opacity:0.65; margin-top:1rem; font-style:italic; padding-bottom:1.75rem; }
    .sign__tape      { margin:0 -2rem; padding:0.55rem 2rem; background:repeating-linear-gradient(-45deg,rgba(168,85,247,0.13),rgba(168,85,247,0.13) 10px,rgba(168,85,247,0.04) 10px,rgba(168,85,247,0.04) 20px); border-top:1px solid rgba(168,85,247,0.18); font-size:0.58rem; font-family:'Space Grotesk',sans-serif; text-transform:uppercase; letter-spacing:0.3em; color:rgba(192,132,252,0.55); text-align:center; }
  </style>

  <script type="module">
    import { getInfoTopics } from './src/services/infoService.js';
    import { getPageContent } from './src/services/pagesService.js';

    const UNDER_CONSTRUCTION = `
      <div class="sign">
        <div class="sign__leaf-row">🍃 🌿 🍃</div>
        <span class="sign__cone">🚧</span>
        <p class="sign__overline">Under Construction</p>
        <h2 class="sign__title">The Lore</h2>
        <div class="sign__divider"></div>
        <p class="sign__body">Ancient strain secrets are being decoded.<br>The universe is still speaking. 🔮</p>
        <p class="sign__tagline">— the lore goes deep, be patient</p>
        <div class="sign__tape">🌿 &nbsp; decoding the cosmos &nbsp; 🌿</div>
      </div>`;

    function renderTopics(topics) {
      const body   = document.getElementById('lore-body');
      const tape   = document.getElementById('lore-tape');
      const header = document.querySelector('.lore-header');

      // If no topics have content yet, show under-construction sign and hide the header
      const hasContent = topics && topics.some(t => t.content?.trim());
      if (!hasContent) {
        header.style.display = 'none';
        body.innerHTML = UNDER_CONSTRUCTION;
        return;
      }

      tape.style.display = '';
      body.innerHTML = '<div class="topics-grid" id="topics-grid"></div>';
      const grid = document.getElementById('topics-grid');

      if (!topics || topics.length === 0) {
        grid.innerHTML = `
          <div style="text-align:center;padding:3rem 1rem;color:var(--dim);">
            <div style="font-size:2rem;margin-bottom:0.75rem;">🔮</div>
            <p style="font-size:0.9rem;">The lore is being decoded…<br>Check back soon.</p>
          </div>`;
        return;
      }

      topics.forEach((topic, i) => {
        const icon    = topic.icon    || '🌿';
        const teaser  = topic.teaser  || '';
        const content = topic.content || '';
        // Strip emoji from title for display if icon field is set
        const titleText = topic.title || '';

        const card = document.createElement('div');
        card.className = 'topic-card';
        card.style.animationDelay = `${i * 0.06}s`;
        card.innerHTML = `
          <button class="topic-card__trigger" aria-expanded="false" aria-controls="topic-body-${i}">
            <span class="topic-card__icon" aria-hidden="true">${icon}</span>
            <span class="topic-card__text">
              <span class="topic-card__title">${titleText}</span>
              ${teaser ? `<span class="topic-card__teaser">${teaser}</span>` : ''}
            </span>
            <span class="topic-card__chevron" aria-hidden="true">▾</span>
          </button>
          <div class="topic-card__body" id="topic-body-${i}" role="region">
            <div class="topic-card__body-inner">
              <div class="topic-card__content">
                ${content
                  ? `<p>${content.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</p>`
                  : '<p class="topic-coming-soon">✦ Content coming soon…</p>'
                }
              </div>
            </div>
          </div>
        `;

        const trigger = card.querySelector('.topic-card__trigger');
        trigger.addEventListener('click', () => {
          const isOpen = card.classList.contains('topic-card--open');
          // Close all others
          document.querySelectorAll('.topic-card--open').forEach(c => {
            c.classList.remove('topic-card--open');
            c.querySelector('.topic-card__trigger').setAttribute('aria-expanded', 'false');
          });
          if (!isOpen) {
            card.classList.add('topic-card--open');
            trigger.setAttribute('aria-expanded', 'true');
          }
        });

        grid.appendChild(card);
      });
    }

    (async () => {
      const [topics, loreData] = await Promise.all([
        getInfoTopics(),
        getPageContent('lore'),
      ]);

      // Update intro text if admin has set one
      if (loreData?.content?.trim()) {
        document.getElementById('lore-intro').textContent = loreData.content.trim();
      }

      renderTopics(topics);
    })();
  </script>

</body>
</html>
