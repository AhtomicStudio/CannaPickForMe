<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="6" fill="#0a0e17"/>
  <g transform="translate(16,16)">
    <g fill="#22c55e">
      <!-- Center leaf -->
      <ellipse cx="0" cy="-5" rx="2.5" ry="6" opacity="0.95"/>
      <!-- Left leaves -->
      <ellipse cx="-4.5" cy="-3" rx="2.2" ry="5" transform="rotate(30)" opacity="0.9"/>
      <ellipse cx="-6.5" cy="0" rx="1.8" ry="4" transform="rotate(55)" opacity="0.8"/>
      <!-- Right leaves -->
      <ellipse cx="4.5" cy="-3" rx="2.2" ry="5" transform="rotate(-30)" opacity="0.9"/>
      <ellipse cx="6.5" cy="0" rx="1.8" ry="4" transform="rotate(-55)" opacity="0.8"/>
      <!-- Stem -->
      <rect x="-0.7" y="1" width="1.4" height="7" rx="0.7" opacity="0.7"/>
    </g>
    <!-- Glow -->
    <circle cx="0" cy="-2" r="8" fill="#4ade80" opacity="0.08"/>
  </g>
</svg>
